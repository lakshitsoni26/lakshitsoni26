<svg width="400" height="50" viewBox="0 0 400 50" xmlns="http://www.w3.org/2000/svg">
  <style>
    .typing-text {
      font-family: 'Courier New', Courier, monospace;
      font-size: 24px;
      fill: #00ffff; /* Neon Cyan */
      filter: drop-shadow(0 0 5px #00ffff);
    }
    .cursor {
      fill: #ff00ff; /* Neon Magenta */
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .typewriter {
      stroke: #00ffff;
      stroke-width: 0;
      stroke-dasharray: 400;
      stroke-dashoffset: 400;
      fill: #00ffff;
      animation: type 3s steps(20, end) forwards;
    }
    @keyframes type {
      to { stroke-dashoffset: 0; }
    }
  </style>
  <text x="10" y="35" class="typing-text">
    &gt; Hello World_<animate attributeName="opacity" values="0;1;1;1;1" keyTimes="0;0.1;0.8;0.9;1" dur="2s" repeatCount="1"/>
  </text>
  <rect x="200" y="15" width="12" height="24" class="cursor">
     <animateTransform attributeName="transform" type="translate" from="0 0" to="190 0" dur="2s" fill="freeze" keyTimes="0;1" values="0 0; 190 0" calcMode="discrete"/> 
     <!-- Simplified logic for cursor movement simulation -->
  </rect>
</svg>
